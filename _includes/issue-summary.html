<article class="archive-item">
  <p class="muted">
    <time datetime="{{ include.issue.date | date: '%Y-%m-%d' }}">{{ include.issue.date | date: '%Y-%m-%d' }}</time>
    {% if include.issue.sample %}<span class="label">试刊</span>{% endif %}
  </p>
  <h3><a href="{{ include.issue.url | relative_url }}">{{ include.issue.title | escape }}</a></h3>
  {% if include.issue.summary %}<p>{{ include.issue.summary | escape }}</p>{% endif %}
</article>
