<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | normalize_whitespace | escape }}">
  <title>{% if page.section != 'home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  {% if page.sample %}<meta name="robots" content="noindex">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
</head>
<body>
  <a class="skip-link" href="#main-content">{% if page.lang == 'en' %}Skip to content{% else %}跳到正文{% endif %}</a>
  <header class="site-header">
    <div class="site-width header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Dong Wang · 王冬"><span lang="en">Dong Wang</span><span lang="zh-CN">王冬</span></a>
      <nav class="site-nav" aria-label="主导航" lang="zh-CN">
        {% for entry in site.data.navigation %}
          <a href="{{ entry.url | relative_url }}"{% if page.section == entry.id %} aria-current="{% if page.url == entry.url %}page{% else %}true{% endif %}"{% endif %}>{{ entry.label | escape }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main id="main-content" class="site-width{% if page.section == 'home' %} home{% else %} interior{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-width footer-inner">
      <span><span lang="en">Dong Wang</span> <span lang="zh-CN">王冬</span></span>
      <a href="mailto:dongwang@seu.edu.cn">dongwang@seu.edu.cn</a>
    </div>
  </footer>
  {% if page.section == 'home' %}<script src="{{ '/assets/legacy-links.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
