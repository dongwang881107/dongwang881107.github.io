outputs:
  - year: 2026
    kind: award
    title: { zh-CN: 第五届萧树铁应用数学奖, en: Fifth CSIAM Xiao Shutie Prize }
    credit: Jijun Liu · Chinese Society for Industrial and Applied Mathematics
    description:
      zh-CN: 刘继军获奖，研究方向为数学物理反问题、大规模科学计算与介质成像。
      en: Awarded to Jijun Liu, whose research spans inverse problems in mathematical physics, large-scale scientific computing, and imaging of media.
    url: https://jsamath.seu.edu.cn/2026/1010/c54699a585379/page.htm
  - year: 2026
    kind: article
    title: { zh-CN: 边界阻抗与内部电导率的同步恢复, en: On the Simultaneous Recovery of Boundary Impedance and Internal Conductivity }
    credit: Jinchao Pan, Jijun Liu · SIAM Journal on Applied Mathematics
    description:
      zh-CN: 在可获得局部内部测量的条件下，研究怎样同时估计边界阻抗与介质内部电导率。
      en: Studies joint recovery of boundary impedance and interior conductivity when local interior measurements are available.
    url: https://doi.org/10.1137/24M1687066
  - year: 2026
    kind: patent
    title: { zh-CN: 基于压缩感知的线圈敏感度和磁共振图像联合重建方法, en: Joint Reconstruction of Coil Sensitivities and MR Images Using Compressed Sensing }
    credit: Shing-Tung Yau, Jijun Liu, Liyan Wang, Dong Wang
    description:
      zh-CN: 将线圈敏感度估计与 MRI 图像重建放在同一求解流程中。2026 年获授权（CN117491929B）。
      en: Jointly estimates coil sensitivities and reconstructs MR images. The invention patent was granted in 2026 (CN117491929B).
    path: /cv/#Patents
  - year: 2025
    kind: article
    title: { zh-CN: 多障碍物时域声散射的分解计算, en: On the Computation of Time-Domain Acoustic Scattering by Multiple Obstacles Using a Decomposition Method }
    credit: Shutong Hou, Jijun Liu, Haibing Wang · SIAM Journal on Applied Mathematics
    description:
      zh-CN: 用时域边界积分方程分析散射分解的存在性与唯一性，并据此构建多障碍散射计算方法。
      en: Uses time-domain boundary integral equations to establish existence and uniqueness for a decomposition and build a numerical method for multiple scattering.
    url: https://doi.org/10.1137/24M1714873
  - year: 2024
    kind: article
    title: { zh-CN: M³S-Net 低剂量 PET/CT 影像增强, en: M³S-Net for Low-Dose PET/CT Enhancement }
    credit: Dong Wang, Chong Jiang, Jian He, Yue Teng, Hourong Qin, Jijun Liu, Xiaoping Yang · Physics in Medicine & Biology
    description:
      zh-CN: 在合作研究中，将 CT 结构信息与低剂量 PET 观测结合，用于提升 PET 图像的细节表达。
      en: This collaborative study combines CT structural information with low-dose PET data to improve detail in the estimated PET images.
    url: https://doi.org/10.1088/1361-6560/ad14c5
    code: https://github.com/dongwang881107/DeepPETCT
  - year: 2017
    kind: award
    title: { zh-CN: 偏微分方程反问题数值解及应用, en: Numerical Solutions of PDE Inverse Problems and Their Applications }
    credit: Jijun Liu, Haibing Wang, Liyan Wang, Ming Yang
    description:
      zh-CN: 获 2017 年度教育部高等学校科学研究优秀成果奖（自然科学）二等奖。
      en: Recipient of a 2017 Ministry of Education award for outstanding research in higher education, second prize in natural sciences.
    url: https://yauc.seu.edu.cn/2020/0319/c27551a321208/page.htm
