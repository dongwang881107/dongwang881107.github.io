people:
  - name: { zh-CN: 刘继军, en: Jijun Liu }
    lead: true
    role: { zh-CN: 课题组负责人 · 二级教授、博士生导师, en: Group lead · Professor and doctoral supervisor }
    affiliation: { zh-CN: 东南大学数学学院, en: School of Mathematics, Southeast University }
    focus:
      zh-CN: 研究偏微分方程反问题与正则化，涵盖逆散射、介质与医学成像、分数阶扩散及数据同化。获第五届萧树铁应用数学奖，为 2017 年度教育部自然科学二等奖第一完成人。
      en: Researches PDE inverse problems and regularization, including inverse scattering, imaging of media, biomedical imaging, fractional diffusion, and data assimilation. Received the fifth Xiao Shutie Applied Mathematics Award and was the lead recipient of a 2017 Ministry of Education natural sciences second prize.
    url: https://math.seu.edu.cn/ljj/main.psp
    photo: { path: /assets/images/group/jijun-liu.jpg, width: 395, height: 480 }
  - name: { zh-CN: 王海兵, en: Haibing Wang }
    role: { zh-CN: 教授、博士生导师 · 计算数学系主任, en: Professor and doctoral supervisor · Head of Computational Mathematics }
    affiliation: { zh-CN: 东南大学数学学院, en: School of Mathematics, Southeast University }
    focus:
      zh-CN: 2012 年获北海道大学与东南大学理学博士学位。研究偏微分方程反问题及其数值方法，涵盖波动方程源项反演、时域声散射与扩散方程反问题。以第二完成人获 2017 年度教育部自然科学二等奖，2024 年与刘继军合著《反问题的正则化理论和应用》。
      en: Earned doctoral degrees in science from Hokkaido University and Southeast University in 2012. He develops numerical methods for PDE inverse problems in wave source recovery, time-domain acoustic scattering, and diffusion. He was the second-listed contributor on a project that received a natural sciences second prize from China’s Ministry of Education in 2017. He coauthored a monograph on inverse problem regularization with Jijun Liu in 2024.
    url: https://math.seu.edu.cn/2016/0921/c16529a170145/page1.htm
    link_label: { zh-CN: 东南大学论文与著作列表, en: Publications at Southeast University }
    photo: { path: /assets/images/group/haibing-wang.png, width: 308, height: 410 }
  - name: { zh-CN: 钟敏, en: Min Zhong }
    role: { zh-CN: 教授、博士生导师, en: Professor and doctoral supervisor }
    affiliation: { zh-CN: 东南大学数学学院, en: School of Mathematics, Southeast University }
    focus:
      zh-CN: 本科毕业于兰州大学，2014 年获复旦大学理学博士学位，曾赴澳大利亚联邦科学与工业研究组织（CSIRO）联合培养。研究数学物理反问题，发展多尺度反演与 Banach 空间迭代正则化方法，并应用于电阻抗成像和声电层析成像。主持国家自然科学基金面上项目，入选东南大学首批「至善青年学者」。
      en: Earned a bachelor’s degree from Lanzhou University and a Ph.D. from Fudan University in 2014, with part of her doctoral training at Australia’s CSIRO. She develops multiscale inversion and iterative regularization in Banach spaces for inverse problems in mathematical physics, including electrical impedance tomography and acousto-electric tomography. She leads general research projects funded by the National Natural Science Foundation of China and was named to Southeast University’s inaugural cohort of Zhishan Young Scholars.
    url: https://math.seu.edu.cn/_s256/zm/list.psp
    photo: { path: /assets/images/group/min-zhong.png, width: 296, height: 396 }
  - name: { zh-CN: 张嫱, en: Qiang Zhang }
    role: { zh-CN: 科研合作 · 生物医学成像反问题, en: Research collaborator · Inverse problems in biomedical imaging }
    affiliation: { zh-CN: 河海大学数学与统计学院, en: School of Mathematics and Statistics, Hohai University }
    focus:
      zh-CN: 东南大学计算数学博士，师从刘继军教授，曾在东京大学联合培养。研究介质电导率反演、荧光扩散光学层析、心脏电活动反演及不适定问题的正则化。
      en: Earned a Ph.D. in computational mathematics at Southeast University under Jijun Liu and was jointly trained at the University of Tokyo. Researches conductivity recovery, fluorescence diffuse optical tomography, cardiac electrophysiology inversion, and regularization.
    url: https://doi.org/10.3934/ipi.2024008
    link_label: { zh-CN: 查看代表论文, en: Selected paper }
    photo: { path: /assets/images/group/qiang-zhang.jpg, width: 289, height: 405 }
  - name: { zh-CN: 王冬, en: Dong Wang }
    role: { zh-CN: 南京中医药大学副教授, en: Associate Professor at Nanjing University of Chinese Medicine }
    focus:
      zh-CN: 获南京理工大学控制科学与工程博士学位。曾在东南大学数学学院和丘成桐中心任至善博士后，合作导师为刘继军教授，后任南京应用数学中心助理研究员。主要研究医学成像反问题，运用变分正则化、压缩感知和深度学习发展电阻抗成像、快速 MRI 与低剂量 PET/CT 的重建算法。曾主持低剂量 PET 重建与病灶识别方向的国家自然科学基金青年项目。
      en: Earned a Ph.D. in Control Science and Engineering at Nanjing University of Science and Technology. He was a Zhishan Postdoctoral Fellow with Jijun Liu at Southeast University’s School of Mathematics and S. T. Yau Center, then an Assistant Research Fellow at the Nanjing Center for Applied Mathematics. He studies inverse problems in medical imaging, using variational regularization, compressed sensing, and deep learning for electrical impedance tomography, fast MRI, and low-dose PET/CT reconstruction. He led an NSFC Young Scientists Fund project on low-dose PET reconstruction and lesion recognition.
    path: /cv/
    link_label: { zh-CN: 个人简历, en: Curriculum vitae }
    photo: { path: /assets/images/group/dong-wang.png, width: 399, height: 600 }
directions:
  - title: { zh-CN: 偏微分方程反问题与正则化, en: PDE inverse problems and regularization }
    description:
      zh-CN: 研究从有限、含噪观测确定未知参数的条件，分析唯一性、稳定性与正则化误差。
      en: Study when unknown parameters can be recovered from limited, noisy observations, with a focus on uniqueness, stability, and regularization error.
  - title: { zh-CN: 电阻抗成像与介质反演, en: Electrical impedance tomography and material parameter recovery }
    description:
      zh-CN: 研究电极接触阻抗与内部电导率的相互影响，结合物理模型、正则化和实测数据评估重建结果。
      en: Study the interaction between electrode contact impedance and internal conductivity using physical models, regularization, and measured-data validation.
    path: /group/frontiers/quantitative-eit/
    link_label: { zh-CN: 阅读电阻抗成像前沿专题, en: Read the EIT research frontier }
  - title: { zh-CN: 大规模科学计算与成像, en: Large-scale scientific computing and imaging }
    description:
      zh-CN: 面向多障碍声波散射、数据同化与医学影像重建，发展可计算的模型、分解方法和求解算法。
      en: Develop computational models, decomposition methods, and solvers for multiple-obstacle acoustic scattering, data assimilation, and medical image reconstruction.
