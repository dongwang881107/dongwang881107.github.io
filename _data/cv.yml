research:
  intro:
    zh-CN: 研究医学成像与分析中的数学理论、模型和算法，重点关注反问题、压缩感知、变分正则化与深度学习。
    en: I develop mathematical models and computational methods for medical imaging and analysis, focusing on inverse problems, compressed sensing, variational regularization, and deep learning.
  topics:
    - zh-CN: MRI、CT 与核医学（PET、SPECT）图像重建。
      en: Image reconstruction for MRI, CT, and nuclear medicine (PET and SPECT).
    - zh-CN: 电阻抗成像与电导率重建。
      en: Electrical impedance tomography and conductivity reconstruction.
    - zh-CN: 医学图像分割、配准、融合与生成。
      en: Medical image segmentation, registration, fusion, and generation.
    - zh-CN: 面向医学成像的科学计算、并行编程与科研软件。
      en: Scientific computing, parallel programming, and research software for medical imaging.
