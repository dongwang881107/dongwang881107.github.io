research:
  zh-CN:
    title: 电阻抗成像科研进展
    summary: 围绕电极测量建模、电导率重建和不规则边界有限元计算，梳理课题组 EIT 技术报告中的方法与验证。
    path: /group/research/eit-technical-progress/
    link_label: 查看技术进展与实验图
    highlights:
      - 完整电极模型与伴随灵敏度
      - 多激励加速反演和公开 KIT4 水槽实例
      - 不规则边界重建、电极标记与正演误差分析
    image:
      path: /assets/images/group/eit-irregular-domain-mesh.png
      width: 1208
      height: 427
      alt: 由合成边界点恢复的曲线、电极标记及三角网格。
      caption: 不规则边界、电极标记与有限元网格 · 技术报告图 14
  en:
    title: Research Progress in Electrical Impedance Tomography
    summary: The research group’s technical report documents electrode modeling, conductivity reconstruction, and finite-element calculations on irregular boundaries.
    path: /group/research/eit-technical-progress/
    link_label: Read the technical progress and experiments
    highlights:
      - Complete electrode model and adjoint sensitivities
      - Accelerated inversion with multiple current patterns and open KIT4 tank examples
      - Boundary reconstruction, electrode tagging, and forward error analysis
    image:
      path: /assets/images/group/eit-irregular-domain-mesh.png
      width: 1208
      height: 427
      alt: A reconstructed synthetic boundary, labeled electrodes, and a triangular mesh.
      caption: Irregular boundary, electrode tags, and finite-element mesh · Technical report Figure 14
